<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katta bannerlar — SafeHome Admin</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Katta bannerlar</h1>
        <p>"Kategoriya bo'yicha tanlang" bo'limidagi 2 ta katta reklama kartochkasi</p>
      </div>
      <button class="btn btn--primary" id="addBtn">+ Banner qo'shish</button>
    </div>

    <div class="panel">
      <div class="panel__head"><h2>Barcha bannerlar</h2></div>
      <table>
        <thead>
          <tr><th>Rasm</th><th>Yorliq</th><th>Sarlavha</th><th>Havola</th><th>Amallar</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Banner qo'shish</h3>
    <form id="bannerForm">
      <input type="hidden" name="id">
      <div class="form__row">
        <label>Fon rasmi (URL)</label>
        <input type="text" name="image" required placeholder="assets/img/...">
      </div>
      <div class="form__row">
        <label>Yorliq (kichik, yuqorida)</label>
        <input type="text" name="label" required placeholder="Masalan: XAVFSIZLIK TIZIMI">
      </div>
      <div class="form__row">
        <label>Sarlavha</label>
        <input type="text" name="title" required placeholder="Masalan: Yagona uy xavfsizligi">
      </div>
      <div class="form__row">
        <label>Havola (bosilganda qayerga o'tadi)</label>
        <input type="text" name="link" placeholder="product.html?cat=... yoki #contact">
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--outline" id="cancelBtn">Bekor qilish</button>
        <button type="submit" class="btn btn--primary">Saqlash</button>
      </div>
    </form>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/admin.js"></script>
<script>
  const overlay = document.getElementById('modalOverlay');
  const form = document.getElementById('bannerForm');
  const modalTitle = document.getElementById('modalTitle');

  function openModal(item) {
    form.reset();
    if (item) {
      modalTitle.textContent = 'Bannerni tahrirlash';
      form.id.value = item.id;
      form.image.value = item.image;
      form.label.value = item.label;
      form.title.value = item.title;
      form.link.value = item.link || '';
    } else {
      modalTitle.textContent = "Banner qo'shish";
      form.id.value = '';
    }
    overlay.classList.add('open');
  }
  function closeModal() { overlay.classList.remove('open'); }

  document.getElementById('addBtn').addEventListener('click', () => openModal(null));
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    const payload = {
      image: data.image.trim(),
      label: data.label.trim(),
      title: data.title.trim(),
      link: data.link.trim() || '#contact',
    };
    if (data.id) {
      updateItem('featureBanners', Number(data.id), payload);
    } else {
      payload.createdAt = new Date().toISOString().slice(0, 10);
      addItem('featureBanners', payload);
    }
    closeModal();
    render();
  });

  function render() {
    const items = getAll('featureBanners');
    const tbody = document.getElementById('rows');
    if (!items.length) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Bannerlar yo'q. Yuqoridagi tugma orqali qo'shing.</td></tr>`;
      return;
    }
    tbody.innerHTML = items.map(b => `
      <tr>
        <td>${b.image ? `<img class="mini-thumb" src="../${escapeHtml(b.image)}" alt="">` : '-'}</td>
        <td>${escapeHtml(b.label)}</td>
        <td><strong>${escapeHtml(b.title)}</strong></td>
        <td>${escapeHtml(b.link || '-')}</td>
        <td class="actions">
          <button class="btn btn--outline btn--icon" data-edit="${b.id}">✏️</button>
          <button class="btn btn--danger btn--icon" data-del="${b.id}">🗑️</button>
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = items.find(i => i.id === Number(btn.dataset.edit));
        openModal(item);
      });
    });
    tbody.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (confirm("Ushbu bannerni o'chirishni tasdiqlaysizmi?")) {
          deleteItem('featureBanners', Number(btn.dataset.del));
          render();
        }
      });
    });
  }

  render();
</script>
</body>
</html>
